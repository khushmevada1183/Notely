name: Notely Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notely-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VSCODE_ARCH: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libgbm1 \
            libgtk-3-0 \
            fakeroot

      - name: Install Node dependencies
        run: npm ci

      - name: Package Linux x64 (.deb installer)
        run: |
          npm run gulp notely-linux-x64
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Collect Linux installer (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          mkdir -p release-artifacts
          DEB=$(find .build/linux/deb -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "No .deb package found" >&2
            exit 1
          fi
          cp "$DEB" "release-artifacts/notely-${VERSION}-linux-amd64.deb"
          ls -la release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release-artifacts/*
          if-no-files-found: error

  darwin-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VSCODE_ARCH: arm64
      NPM_ARCH: arm64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GYP_DEFINES: kerberos_use_rtld=false
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "npm ci failed attempt $i, retrying..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}

      - name: Package macOS arm64 (.dmg installer)
        run: npm run gulp notely-darwin-arm64

      - name: Collect macOS installer (.dmg with Notely.app)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          mkdir -p release-artifacts
          NOTELY_APP_NAME=$(node -p "require('./product.json').nameLong")
          APP="../VSCode-darwin-arm64/${NOTELY_APP_NAME}.app"
          if [ ! -d "$APP" ]; then
            echo "App bundle not found: $APP" >&2
            ls -la "../VSCode-darwin-arm64/" || true
            exit 1
          fi
          hdiutil create \
            -volname "Notely" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "release-artifacts/notely-${VERSION}-mac-arm64.dmg"
          ls -la release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: release-artifacts/*
          if-no-files-found: error

  win32-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VSCODE_ARCH: x64
      NPM_ARCH: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            try {
              npm ci
              break
            } catch {
              if ($i -eq 5) { throw }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: 'true'

      - name: Package Windows x64 (.exe installer)
        run: |
          npm run gulp notely-win32-x64
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Collect Windows installer (.exe)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version -like 'v*') { $version = $version.Substring(1) }
          else { $version = node -p "require('./package.json').version" }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $setup = Get-ChildItem -Path ".build/win32-x64/user-setup" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Error "No setup .exe found under .build/win32-x64/user-setup"
            Get-ChildItem -Recurse .build/win32-x64 -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Copy-Item $setup.FullName "release-artifacts/notely-$version-win-x64-setup.exe"
          Get-ChildItem release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux-x64, darwin-arm64, win32-x64]
    if: ${{ needs.linux-x64.result == 'success' && needs.darwin-arm64.result == 'success' && needs.win32-x64.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -la release-artifacts/

      - name: Resolve release tag
        id: rel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA:0:7}"
            VER=$(node -p "require('./package.json').version")
            echo "tag=v${VER}-main.${SHORT}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## Install Notely

            | Platform | Installer |
            |----------|-----------|
            | **Linux** (Debian/Ubuntu) | `notely-*-linux-amd64.deb` — `sudo apt install ./notely-*-linux-amd64.deb` |
            | **macOS** (Apple Silicon) | `notely-*-mac-arm64.dmg` — open and drag Notely to Applications |
            | **Windows** (x64) | `notely-*-win-x64-setup.exe` — run the user installer |
