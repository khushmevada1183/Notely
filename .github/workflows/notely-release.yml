name: Notely Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    env:
      VSCODE_ARCH: x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libgbm1 \
            libgtk-3-0 \
            fakeroot \
            rpm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile production build
        run: npm run compile-build

      - name: Package Linux x64
        run: npm run gulp vscode-linux-x64

      - name: Build .deb package
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Archive portable Linux build
        run: |
          tar -czf notely-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp notely-linux-x64.tar.gz release-artifacts/
          find .build/linux/deb -name '*.deb' -exec cp {} release-artifacts/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
