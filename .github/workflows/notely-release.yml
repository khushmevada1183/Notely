name: Notely Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notely-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VSCODE_ARCH: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libkrb5-dev \
            libgbm1 \
            libgtk-3-0 \
            fakeroot \
            rpm

      - name: Install Node dependencies
        run: npm ci

      - name: Compile production build
        run: npm run compile-build

      - name: Package Linux x64
        run: npm run gulp vscode-linux-x64

      - name: Build .deb package
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb

      - name: Collect Linux artifacts
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/notely-linux-x64.tar.gz -C .. VSCode-linux-x64
          find .build/linux/deb -name '*.deb' -exec cp {} release-artifacts/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release-artifacts/*
          if-no-files-found: error

  darwin-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 180
    env:
      VSCODE_ARCH: arm64
      NPM_ARCH: arm64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GYP_DEFINES: kerberos_use_rtld=false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        run: |
          python3 -m pip install --break-system-packages setuptools
          for i in {1..5}; do
            npm ci && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "npm ci failed attempt $i, retrying..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}

      - name: Compile production build
        run: npm run compile-build

      - name: Package macOS arm64
        run: npm run gulp vscode-darwin-arm64

      - name: Collect macOS artifacts
        run: |
          mkdir -p release-artifacts
          NOTELY_APP_NAME=$(node -p "require('./product.json').nameLong")
          APP="../VSCode-darwin-arm64/${NOTELY_APP_NAME}.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-artifacts/notely-darwin-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: release-artifacts/*
          if-no-files-found: error

  win32-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VSCODE_ARCH: x64
      NPM_ARCH: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        shell: pwsh
        run: |
          node build/npm/preinstall.ts
          for ($i = 1; $i -le 5; $i++) {
            try {
              npm ci
              break
            } catch {
              if ($i -eq 5) { throw }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          npm_config_foreground_scripts: 'true'

      - name: Compile production build
        run: npm run compile-build

      - name: Package Windows x64
        run: |
          npm run gulp vscode-win32-x64
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path "../VSCode-win32-x64" -DestinationPath "release-artifacts/notely-win32-x64.zip"
          Get-ChildItem -Path ".build/win32-x64/user-setup" -Filter "*.exe" | Copy-Item -Destination release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux-x64, darwin-arm64, win32-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -la release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Linux x64 (portable) | `notely-linux-x64.tar.gz` |
            | Linux x64 (Debian/Ubuntu) | `*.deb` |
            | macOS Apple Silicon | `notely-darwin-arm64.zip` |
            | Windows x64 (portable) | `notely-win32-x64.zip` |
            | Windows x64 (installer) | `VSCodeSetup*.exe` |

            **Linux:** extract the tarball and run `./notely`, or install the `.deb`.

            **macOS:** unzip, then open `Notely.app` (right-click → Open if Gatekeeper blocks it).

            **Windows:** run the setup `.exe` or extract the zip portable build.
